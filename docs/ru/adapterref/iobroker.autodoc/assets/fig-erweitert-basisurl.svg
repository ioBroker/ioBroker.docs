  <rect x="24" y="24" width="872" height="44" rx="6" fill="#e2e8f0"/>
  <text x="48" y="53" fill="#334155" font-family="Segoe UI,sans-serif" font-size="18" font-weight="600">Erweitert (vereinfacht)</text>
  <rect x="24" y="84" width="872" height="220" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="48" y="118" fill="#475569" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600">ioBroker Basis-URL (Beispieldarstellung)</text>
