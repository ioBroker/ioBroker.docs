<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif" font-size="11">
  <rect width="700" height="420" fill="#1e1e1e"/>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#aaa"/>
    </marker>
    <marker id="arrBlue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#6AB0FF"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" fill="#ccc" font-size="13" font-weight="bold">Cascading Constellations (LPC §2.4)</text>

  <!-- === Level 1: Grid Operator / Controlbox === -->
  <rect x="250" y="45" width="200" height="55" rx="8" fill="#2a4a7a" stroke="#6AB0FF" stroke-width="1.5"/>
  <text x="350" y="65" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">Controlbox</text>
  <text x="350" y="82" text-anchor="middle" fill="#aaa" font-size="10">(Grid Operator)</text>
  <rect x="290" y="87" width="50" height="14" rx="3" fill="#4A90D9"/>
  <text x="315" y="97" text-anchor="middle" fill="#fff" font-size="8">EG</text>

  <!-- === Level 2: CEM / HEMS (dual role) === -->
  <rect x="160" y="170" width="380" height="80" rx="8" fill="#2a3a2a" stroke="#66CC6A" stroke-width="1.5"/>
  <text x="350" y="192" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">CEM / HEMS (ioBroker Adapter)</text>

  <!-- CS role box (left) -->
  <rect x="180" y="205" width="50" height="14" rx="3" fill="#E57373"/>
  <text x="205" y="215" text-anchor="middle" fill="#fff" font-size="8">CS</text>
  <text x="180" y="237" fill="#888" font-size="9">receives limit</text>

  <!-- EG role boxes (right) -->
  <rect x="380" y="205" width="50" height="14" rx="3" fill="#4A90D9"/>
  <text x="405" y="215" text-anchor="middle" fill="#fff" font-size="8">EG 1</text>
  <rect x="440" y="205" width="50" height="14" rx="3" fill="#4A90D9"/>
  <text x="465" y="215" text-anchor="middle" fill="#fff" font-size="8">EG n</text>
  <text x="380" y="237" fill="#888" font-size="9">distributes limit</text>

  <!-- Arrow between CS and EG inside CEM -->
  <line x1="235" y1="212" x2="375" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <text x="305" y="225" text-anchor="middle" fill="#666" font-size="8">FSM + distribution</text>

  <!-- === Level 3: Consumer Devices === -->
  <!-- Heatpump -->
  <rect x="130" y="330" width="160" height="55" rx="8" fill="#3a2a3a" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="210" y="352" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">Heatpump</text>
  <rect x="170" y="365" width="50" height="14" rx="3" fill="#E57373"/>
  <text x="195" y="375" text-anchor="middle" fill="#fff" font-size="8">CS</text>

  <!-- EV Charger -->
  <rect x="340" y="330" width="160" height="55" rx="8" fill="#3a2a3a" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="420" y="352" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">EV Charger</text>
  <rect x="380" y="365" width="50" height="14" rx="3" fill="#E57373"/>
  <text x="405" y="375" text-anchor="middle" fill="#fff" font-size="8">CS</text>

  <!-- Ellipsis for more -->
  <text x="560" y="360" fill="#888" font-size="16">...</text>

  <!-- === Connections === -->
  <!-- Controlbox EG → CEM CS -->
  <line x1="315" y1="100" x2="205" y2="170" stroke="#6AB0FF" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="220" y="138" fill="#6AB0FF" font-size="9">CS-LPC</text>
  <text x="220" y="150" fill="#6AB0FF" font-size="9">(EEBUS/SHIP)</text>

  <!-- CEM EG 1 → Heatpump CS -->
  <line x1="405" y1="250" x2="210" y2="330" stroke="#6AB0FF" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="270" y="288" fill="#6AB0FF" font-size="9">EG-LPC</text>
  <text x="270" y="300" fill="#6AB0FF" font-size="9">(EEBUS/SHIP)</text>

  <!-- CEM EG n → EV Charger CS -->
  <line x1="465" y1="250" x2="420" y2="330" stroke="#6AB0FF" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="460" y="288" fill="#6AB0FF" font-size="9">EG-LPC</text>

  <!-- === Legend === -->
  <rect x="20" y="395" width="12" height="12" rx="2" fill="#4A90D9"/>
  <text x="37" y="405" fill="#888" font-size="9">EG = Energy Guard (sends limits)</text>

  <rect x="250" y="395" width="12" height="12" rx="2" fill="#E57373"/>
  <text x="267" y="405" fill="#888" font-size="9">CS = Controllable System (receives limits)</text>

  <text x="530" y="405" fill="#666" font-size="9">Each level can cascade further</text>
</svg>
