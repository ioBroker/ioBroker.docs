<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0e8f8f"/>
    </marker>
  </defs>

  <!-- phone -->
  <g>
    <rect x="30" y="70" width="120" height="120" rx="14" fill="#e6f5f5" stroke="#0e8f8f" stroke-width="2"/>
    <rect x="44" y="86" width="92" height="78" rx="4" fill="#fff" stroke="#bcd" stroke-width="1"/>
    <circle cx="90" cy="176" r="5" fill="#0e8f8f"/>
    <text x="90" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6b6b">Phone</text>
    <text x="90" y="232" text-anchor="middle" font-size="11" fill="#5b6b78">OASE app</text>
  </g>

  <!-- computer / mitmproxy -->
  <g>
    <rect x="320" y="60" width="180" height="120" rx="12" fill="#fff" stroke="#0e8f8f" stroke-width="2.5"/>
    <text x="410" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#0b6b6b">Your computer</text>
    <rect x="345" y="104" width="130" height="30" rx="6" fill="#0f2b30"/>
    <text x="410" y="124" text-anchor="middle" font-size="12" fill="#e9f6f6" font-family="monospace">mitmweb</text>
    <text x="410" y="156" text-anchor="middle" font-size="11" fill="#5b6b78">listens on port 8080</text>
    <text x="410" y="172" text-anchor="middle" font-size="11" fill="#5b6b78">UI on :8081</text>
  </g>

  <!-- cloud/internet -->
  <g>
    <rect x="640" y="80" width="120" height="100" rx="12" fill="#e6f5f5" stroke="#0e8f8f" stroke-width="2"/>
    <text x="700" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6b6b">OASE</text>
    <text x="700" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#0b6b6b">Cloud</text>
  </g>

  <!-- arrows -->
  <path d="M152,130 L316,130" fill="none" stroke="#0e8f8f" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="234" y="120" text-anchor="middle" font-size="11" fill="#0b6b6b" font-weight="600">Wi-Fi proxy</text>
  <text x="234" y="150" text-anchor="middle" font-size="10" fill="#5b6b78">IP : 8080</text>

  <path d="M502,130 L636,130" fill="none" stroke="#0e8f8f" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="569" y="120" text-anchor="middle" font-size="11" fill="#0b6b6b" font-weight="600">decrypted</text>

  <!-- certificate note -->
  <g>
    <rect x="326" y="200" width="168" height="34" rx="8" fill="#eef8f6" stroke="#14a08a" stroke-width="1.5"/>
    <text x="410" y="222" text-anchor="middle" font-size="11" fill="#0b6b6b">🔑 trust cert from mitm.it</text>
  </g>
</svg>
