<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- the dark glossy button of the MFD look -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5b5b"/>
      <stop offset="0.48" stop-color="#303030"/>
      <stop offset="0.52" stop-color="#232323"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="16" fill="url(#tile)" stroke="#0e0e0e" stroke-width="2"/>
  <path d="M5 62V20A15 15 0 0 1 20 5H108A15 15 0 0 1 123 20V62Z" fill="url(#gloss)"/>

